[project]
name = "valopoint"
version = "0.1.0"
description = "VCT regional-league stats -> team power scores and international bracket prediction"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0", "requests>=2.31", "beautifulsoup4>=4.12"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
valopoint = "valopoint.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["valopoint", "valopoint.scrape"]
