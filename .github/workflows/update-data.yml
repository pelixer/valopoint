# Daily at 00:00 KST: discover new events, scrape stats, refresh the bracket,
# refit the model. deploy-pages then rebuilds the site.
name: update-data

on:
  workflow_dispatch:
  schedule:
    - cron: "7 15 * * *"   # 00:07 KST (off the hour: GitHub delays :00 schedules the most)

permissions:
  contents: write

concurrency:
  group: data-commit
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e .
      - uses: actions/cache@v4
        with:
          path: data/cache
          key: vlr-cache-${{ github.run_id }}
          restore-keys: vlr-cache-
      - name: Discover events (merge new ones)
        timeout-minutes: 10
        run: valopoint events
      - name: Scrape
        timeout-minutes: 240
        run: valopoint scrape
      - name: Bracket
        timeout-minutes: 10
        continue-on-error: true
        run: valopoint bracket
      - name: Commit scraped rows and bracket
        if: always()
        run: |
          git config user.name "valopoint-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/events.json data/rows web/public/data/brackets.json 2>/dev/null || true
          git diff --cached --quiet && echo "no new rows" && exit 0
          git commit -m "data: scrape $(TZ=Asia/Seoul date +%Y-%m-%d\ %H:%M\ KST)"
          git pull --rebase -q origin main && git push
      - name: Export model
        run: valopoint export --source vlr.gg
      - name: Commit model
        run: |
          git add web/public/data/model.json
          git diff --cached --quiet && echo "no model change" && exit 0
          git commit -m "data: model $(TZ=Asia/Seoul date +%Y-%m-%d\ %H:%M\ KST)"
          git pull --rebase -q origin main && git push
