# Scrape vlr.gg, refit the model and commit web/public/data/model.json.
# deploy-pages.yml then rebuilds the site when this workflow finishes.
name: update-data

on:
  workflow_dispatch:
    inputs:
      discover_events:
        description: "Re-discover VCT events (overwrites data/events.json)"
        type: boolean
        default: false
  schedule:
    - cron: "17 */3 * * *"   # every 3 hours (cron is UTC; KST = UTC+9); completed events are skipped

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e .
      - uses: actions/cache@v4
        with:
          path: data/cache
          key: vlr-cache-${{ github.run_id }}
          restore-keys: vlr-cache-
      - name: Discover events
        if: ${{ inputs.discover_events || hashFiles('data/events.json') == '' }}
        timeout-minutes: 10
        run: valopoint events --years 2025 2026
      - name: Scrape
        timeout-minutes: 240
        run: valopoint scrape
      - name: Commit scraped rows
        if: always()
        run: |
          git config user.name "valopoint-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/events.json data/rows || true
          git diff --cached --quiet && echo "no new rows" && exit 0
          git commit -m "data: scrape $(TZ=Asia/Seoul date +%Y-%m-%d\ %H:%M\ KST)"
          git push
      - name: Export model
        run: valopoint export --source vlr.gg
      - name: Commit model
        run: |
          git add web/public/data/model.json
          git diff --cached --quiet && echo "no model change" && exit 0
          git commit -m "data: model $(TZ=Asia/Seoul date +%Y-%m-%d\ %H:%M\ KST)"
          git push
